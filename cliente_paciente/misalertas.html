    <!--  SECTION ----------------------------------- -->

    <!--  1 ----------------------------------- -->   
        <div class="usu-div-one">

            <div class="seccion-card-one">

        <!-- Botón para abrir la modal -->
        <button id="openModalBtn" class="open-modal-btn hover">VER LA ALERTA MÁS PRÓXIMA A LA TOMA</button>

        <!-- Modal ALERTA MEDICA -->
        <div id="modalalerta" class="modal">
            <div class="modal-content">
                <span class="close" id="closeModalBtn">&times;</span>
                <p>Este es el mensaje de la alerta médica.</p>
                <button id="confirmBtn" class="confirm-btn">Leído</button>
            </div>
        </div>

    <!--SCRIPTS ------------------------------------------------------- -->
    <script src="../main.js"></script>

    <!-- JavaScript -->
    <script>
        document.getElementById("openModalBtn").addEventListener("click", function() {
            document.getElementById("modalalerta").style.display = "flex";

            // Configurar el temporizador para cerrar el modal en 30 segundos
            setTimeout(function() {
                document.getElementById("modalalerta").style.display = "none";
            }, 10000); // 30000 ms = 30 segundos
        });

        document.getElementById("closeModalBtn").addEventListener("click", function() {
            document.getElementById("modalalerta").style.display = "none";
        });

        document.getElementById("confirmBtn").addEventListener("click", function() {
            document.getElementById("modalalerta").style.display = "none";
        });
    </script>

<script>
    document.getElementById("scrollToTop").addEventListener("click", function(event) {
        event.preventDefault(); // Evita el comportamiento por defecto del enlace
        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    });
</script>
